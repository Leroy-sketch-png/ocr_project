ProfitAndLoss:
  _section: income_statement
  Revenue:
    keywords: ["Revenue", "Turnover", "Sales", "Total revenue", "Net revenue", "Total net sales", "Net sales", "Net operating revenues", "Operating revenues", "Sales, net"]
  Gross Profit/Loss:
    keywords: ["Gross Profit", "Gross Loss", "Gross Profit/Loss", "Gross profit / (loss)", "Gross margin"]
  Profit/Loss Before Tax:
    keywords:
      - "Profit Before Tax"
      - "Loss Before Tax"
      - "Loss before income tax"
      - "Profit before income tax"
      - "Income before tax"
      - "PBT"
      - "Result before tax"
      - "Profit/(loss) before tax"
      - "Income before provision for income taxes"
      - "Income before income taxes"
      - "Earnings before tax"
      - "EBT"
      - "Profit / (Loss) before tax from continuing operations"
      - "Profit Loss before tax from continuing operations"
      - "Operating result before tax"
  Net Profit/Loss:
    keywords:
      - "Profit for the Year"
      - "Net Profit/Loss"
      - "Annual result"
      - "Annual on result"
      - "Net profit / (loss)"
      - "Net profit (loss)"
      - "Profit / (loss) for the year"
      - "Net income"
      - "total comprehensive income for the year"
  Operating Profit/Loss:
    keywords:
      - "Operating Profit"
      - "Operating Loss"
      - "Operating Profit/Loss"
      - "Result of operations"
      - "Operating profit / (loss)"
      - "Operating income"
      - "Income from operations"
  Cost of Sales:
    sign: negative
    keywords:
      - "Cost of Sales"
      - "Cost of Goods Sold"
      - "Cost of goods sold and services rendered"
      - "Cost of revenue"
      - "Less: Cost of sales"
      - "Less Cost of sales"
      - "Direct costs"
      - "Cost of services"
      - "Purchase of services"
      - "Purchase of goods"
      # NOTE: Do NOT include 'Total Operating expenses' here — that is a different line item.
      # NOTE: 'Purchase of services' is only meaningful when a Gross Profit line exists.
      #       The repair engine nulls Cost of Sales when Gross Profit/Loss is absent.
  Income Tax Expense:
    _section: income_statement
    keywords:
      - "Income tax expense"
      - "Income tax expenses"
      - "Tax on result"
      - "Tax expense"
      - "Provision for income taxes"
      - "Income tax provision"
      - "Income taxes"

Assets:
  _section: balance_sheet
  Cash and Cash Equivalents:
    keywords: ["Cash and Cash Equivalents", "Cash & Cash Equivalents", "Bank deposits, cash in hand", "Bank deposits", "Cash and bank balances"]
  Current Assets:
    keywords: ["Current Assets", "Total Current Assets", "Total current asset", "Total current assets"]
  Non-Current Assets:
    _restricting_extra: ["other"]
    keywords: ["Non-Current Assets", "Noncurrent Assets", "Total fixed assets", "Total Non-Current Assets", "Total non-current asset"]
  Plant and Equipment:
    # IMPORTANT: 'Right-of-use assets' is a SEPARATE line item (IFRS 16 lease asset).
    # It must NOT be conflated with Plant and Equipment (PP&E).
    _section: ""
    keywords:
      - "Plant and Equipment"
      - "Property Plant and Equipment"
      - "Property, plant and equipment"
      - "PP&E"
      - "plant and machinery"
      - "plant equipment"
      - "Tangible fixed assets"
      - "Fixtures and fittings"
      - "Machinery and equipment"
      - "Plant, machinery and equipment"
      - "Equipment"
  Right of Use Assets:
    # IFRS 16 lease asset — separate from PP&E.
    _section: ""
    keywords:
      - "Right-of-use assets"
      - "Right of use assets"
      - "Lease assets"
      - "ROU assets"
      - "Right-of-use asset"
  Trade Receivables:
    keywords:
      - "Trade Receivables"
      - "trade and other receivables"
      - "accounts receivable"
      - "trade debtors"
      - "receivables from customers"
      - "net receivables"
      - "trade receivable"
      - "Debtors"
      - "Receivables"
      - "Debiteuren"
  Total Assets:
    keywords: ["Total Assets", "Total assets"]

